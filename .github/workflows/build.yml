# Progetto PERSONALE (mashup per il mio gioco): non e' una release per altre persone.
name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone CommonLibSSE-NG (versione fissata)
        shell: bash
        run: |
          mkdir -p lib
          git clone https://github.com/alandtse/CommonLibVR.git lib/commonlibsse-ng
          git -C lib/commonlibsse-ng checkout dbb86c2523fae0cc70de074f3e2d1a6b657758dc

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: .xmake-cache

      - name: Configure
        run: xmake f -y -p windows -a x64 -m releasedbg --skyrim_vr=n

      - name: Build
        run: xmake build -y -v

      - name: Collect output
        shell: bash
        run: |
          mkdir -p out
          cp -r dist/* out/

      - uses: actions/upload-artifact@v4
        with:
          name: BladeFireMode-dll
          path: out
